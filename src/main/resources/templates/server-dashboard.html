<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Distributed System Monitor - Neon NOC</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    
    <style>
        :root {
            --bg-color: #020617;
            --primary-neon: #00ffff;
            --secondary-neon: #ff00ff;
            --error-neon: #ff3131;
            --text-color: #f0f9ff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 20px;
            overflow: hidden; display: flex; height: 100vh;
        }

        #main-container { display: flex; width: 100%; height: 100%; gap: 20px; }

        #visualizer-panel {
            flex: 1.5; background: rgba(0, 255, 255, 0.03);
            border: 2px solid var(--primary-neon); border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            position: relative; display: flex; flex-direction: column; padding: 20px;
        }

        #network-canvas { width: 100%; height: 100%; }

        #log-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; }

        .server-header {
            border: 1px solid var(--primary-neon); padding: 15px;
            border-radius: 8px; background: rgba(0, 255, 255, 0.05);
        }

        #log-container {
            flex: 1; background: rgba(0, 0, 0, 0.7);
            border: 1px solid #333; border-radius: 8px;
            padding: 15px; overflow-y: auto;
            font-family: 'VT323', monospace; font-size: 1.2em;
            display: flex; flex-direction: column-reverse;
        }

        .log-entry { margin: 5px 0; border-bottom: 1px dashed #222; padding-bottom: 5px; }
        .log-type-booking { color: var(--primary-neon); }
        .log-type-sync { color: var(--secondary-neon); }
        .log-type-error { color: var(--error-neon); font-weight: bold; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="visualizer-panel">
        <div style="color:var(--primary-neon); text-align:center; font-size:1.5em; margin-bottom:10px;">NETWORK TOPOLOGY VISUALIZER</div>
        <div id="network-canvas"></div>
    </div>

    <div id="log-panel">
        <div class="server-header">
            <h1 th:text="'NODE: ' + ${serverId}">Server-Duong</h1>
            <div style="font-family:'VT323'; color:#888;">
                Status: <span style="color: #0f0;">ONLINE</span> | 
                Clock: <span id="lamport-clock" style="color:var(--primary-neon)">0</span> |
                Peers: <span id="peer-count">0</span>/4
            </div>
        </div>
        <div id="log-container">
            <div class="log-entry" style="color:#666;">[System] Awaiting WebSocket connection...</div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const myServerId = /*[[${serverId}]]*/ 'Cloud-Server-Duong';
    // Sửa dòng cũ thành dòng này để không bị lỗi khi chưa có link bạn bè
const peerLinks = "[[${peerServers}]]" ? "[[${peerServers}]]".split(',').filter(p => p) : [];
    const neonColor = "#00ffff";
    const syncColor = "#ff00ff";

    // --- 1. KHỞI TẠO CYTOSCAPE ---
    const cy = cytoscape({
        container: document.getElementById('network-canvas'),
        style: [
            {
                selector: 'node',
                style: {
                    'background-color': '#020617',
                    'border-color': neonColor,
                    'border-width': 2,
                    'label': 'data(label)',
                    'color': '#fff',
                    'width': '50px', 'height': '50px',
                    'font-size': '10px', 'text-valign': 'center'
                }
            },
            {
                selector: 'edge',
                style: { 'width': 2, 'line-color': '#333', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier' }
            },
            {
                selector: '.active-edge',
                style: { 'line-color': syncColor, 'width': 4, 'target-arrow-color': syncColor }
            }
        ],
        elements: []
    });

    // --- 2. TẠO NODE ---
    function initNetworkNodes() {
        cy.add({ data: { id: 'me', label: 'ME (' + myServerId + ')' }, position: { x: 300, y: 250 } });
        
        let peers = Array.isArray(peerLinks) ? peerLinks : peerLinks.split(',').filter(p => p);
        peers.forEach((link, i) => {
            const angle = (i / peers.length) * Math.PI * 2;
            const x = 300 + 150 * Math.cos(angle);
            const y = 250 + 150 * Math.sin(angle);
            const peerId = 'peer_' + i;
            cy.add({ data: { id: peerId, label: 'Node ' + (i+1) } , position: { x, y } });
            cy.add({ data: { id: 'edge_' + i, source: 'me', target: peerId } });
        });
        document.getElementById('peer-count').innerText = peers.length;
    }

    // --- 3. KẾT NỐI WEBSOCKET ---
    function connectWebSocket() {
        const socket = new SockJS('/ws-log');
        const stompClient = Stomp.over(socket);
        
        // Tắt log loằng ngoằng của Stomp trong Console
        stompClient.debug = null;

        stompClient.connect({}, function (frame) {
            console.log('Connected to WebSocket!');
            stompClient.subscribe('/topic/logs/' + myServerId, function (logDto) {
                addLogEntry(JSON.parse(logDto.body));
            });
        }, function(error) {
            console.error('WebSocket Error: ', error);
            setTimeout(connectWebSocket, 5000); // Thử kết nối lại sau 5s nếu lỗi
        });
    }

    function addLogEntry(log) {
        const container = document.getElementById('log-container');
        const timeStr = new Date().toLocaleTimeString();
        let typeClass = 'log-type-' + (log.type || 'info').toLowerCase();
        
        if (log.type === 'BOOKING') {
            cy.edges().addClass('active-edge');
            setTimeout(() => cy.edges().removeClass('active-edge'), 1000);
        }

        const html = `<div class="log-entry ${typeClass}">
            <span style="color:#666">[${timeStr}]</span> <b>${log.type}:</b> ${log.message}
        </div>`;
        container.insertAdjacentHTML('afterbegin', html);
        if (log.lamportClock) document.getElementById('lamport-clock').innerText = log.lamportClock;
    }

    window.onload = function() {
        initNetworkNodes();
        connectWebSocket();
    };
</script>
</body>
</html>
