<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Distributed Monitor - Neon Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>
        :root { --bg: #020617; --neon: #00ffff; --sync: #ff00ff; --err: #ff3131; --text: #f0f9ff; }
        body { background: var(--bg); color: var(--text); font-family: 'Orbitron', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar chọn Server */
        #sidebar { width: 250px; border-right: 2px solid var(--neon); padding: 20px; background: rgba(0,255,255,0.02); }
        .nav-btn { width: 100%; padding: 10px; margin-bottom: 10px; background: none; border: 1px solid var(--neon); color: var(--neon); cursor: pointer; font-family: 'Orbitron'; }
        .nav-btn.active { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); }

        #main-content { flex: 1; display: flex; gap: 10px; padding: 10px; }
        #visualizer { flex: 1.2; border: 1px solid var(--neon); border-radius: 10px; position: relative; }
        #log-panel { flex: 1; display: flex; flex-direction: column; border: 1px solid #333; border-radius: 10px; background: rgba(0,0,0,0.5); }
        #log-container { flex: 1; padding: 15px; overflow-y: auto; font-family: 'VT323'; font-size: 1.2em; display: flex; flex-direction: column-reverse; }
        
        .log-entry { margin: 5px 0; border-bottom: 1px solid #1e293b; padding-bottom: 5px; }
        .tag { padding: 2px 5px; border-radius: 3px; font-size: 0.8em; margin-right: 5px; }
        .tag-booking { background: var(--neon); color: #000; }
        .tag-sync { background: var(--sync); color: #fff; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3 style="color: var(--neon)">CONTROL CENTER</h3>
    <button class="nav-btn active" onclick="filterLog('ALL', this)">GLOBAL VIEW</button>
    <button class="nav-btn" th:onclick="filterLog([[${serverId}]], this)">MY NODE ONLY</button>
    <hr style="border-color: #1e293b">
    <div style="font-size: 0.8em; color: #666;">
        Status: <span style="color: #0f0">ONLINE</span><br>
        Clock: <span id="clock-val" style="color: var(--neon)">0</span>
    </div>
</div>

<div id="main-content">
    <div id="visualizer">
        <div id="network-canvas" style="width: 100%; height: 100%;"></div>
    </div>
    <div id="log-panel">
        <div style="padding: 10px; border-bottom: 1px solid #333; text-align: center;">SERVER LOGS</div>
        <div id="log-container"></div>
    </div>
</div>

<script th:inline="javascript">
    const myId = /*[[${serverId}]]*/ 'Duong-Server';
    const rawPeers = /*[[${peerServers}]]*/ '';
    // Fix lỗi split khi chưa có bạn bè
    const peerLinks = (rawPeers && rawPeers !== 'null') ? rawPeers.split(',').filter(p => p) : [];
    
    let allLogs = [];
    let currentFilter = 'ALL';

    // Khởi tạo Cytoscape
    const cy = cytoscape({
        container: document.getElementById('network-canvas'),
        style: [
            { selector: 'node', style: { 'background-color': '#000', 'border-color': '#00ffff', 'border-width': 2, 'label': 'data(label)', 'color': '#fff', 'font-size': '10px', 'text-valign': 'center' } },
            { selector: 'edge', style: { 'width': 2, 'line-color': '#333', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier' } },
            { selector: '.active-edge', style: { 'line-color': '#ff00ff', 'width': 4 } }
        ],
        elements: []
    });

    function initNetwork() {
        cy.add({ data: { id: 'me', label: 'ME ('+myId+')' }, position: { x: 250, y: 200 } });
        peerLinks.forEach((link, i) => {
            const id = 'p' + i;
            cy.add({ data: { id: id, label: 'Peer ' + (i+1) }, position: { x: 250 + 150*Math.cos(i), y: 200 + 150*Math.sin(i) } });
            cy.add({ data: { id: 'e'+i, source: 'me', target: id } });
        });
    }

    function connectWS() {
        const socket = new SockJS('/ws-log');
        const stomp = Stomp.over(socket);
        stomp.debug = null;
        stomp.connect({}, () => {
            stomp.subscribe('/topic/logs/' + myId, (res) => {
                const log = JSON.parse(res.body);
                allLogs.push(log);
                if (log.type === 'BOOKING') {
                    cy.edges().addClass('active-edge');
                    setTimeout(() => cy.edges().removeClass('active-edge'), 1000);
                }
                updateUI();
            });
        });
    }

    function filterLog(val, btn) {
        currentFilter = val;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateUI();
    }

    function updateUI() {
        const container = document.getElementById('log-container');
        container.innerHTML = '';
        const filtered = allLogs.filter(l => currentFilter === 'ALL' || l.serverId === currentFilter);
        filtered.forEach(l => {
            const html = `<div class="log-entry">
                <span class="tag ${l.type === 'BOOKING' ? 'tag-booking' : 'tag-sync'}">${l.type}</span>
                <span style="color: #666">[${new Date().toLocaleTimeString()}]</span> ${l.message}
            </div>`;
            container.insertAdjacentHTML('afterbegin', html);
            if(l.lamportClock) document.getElementById('clock-val').innerText = l.lamportClock;
        });
    }

    window.onload = () => { initNetwork(); connectWS(); };
</script>
</body>
</html>
