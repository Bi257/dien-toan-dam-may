<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Server Node - Distributed Flight Booking</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="neon-text">SERVER NODE: <span th:text="${serverId}">NODE-01</span></h1>
            <div class="status-bar">
                <div class="status-item">Status: <span class="online">ONLINE</span></div>
                <div class="status-item">Lamport Clock: <span id="clock-val" class="neon-blue">0</span></div>
            </div>
        </header>

        <main>
            <div class="control-panel">
                <h3 class="cyan-text">Log Management (Private View)</h3>
                <div class="filter-group">
                    <button class="btn-filter active" onclick="filterLogs('ALL')">ALL</button>
                    <button class="btn-filter" onclick="filterLogs('BOOKING')">BOOKING</button>
                    <button class="btn-filter" onclick="filterLogs('SYNC')">SYNC</button>
                    <button class="btn-filter" onclick="filterLogs('ERROR')">ERROR</button>
                </div>
            </div>

            <div class="log-container" id="log-display">
                <div class="log-entry system">[SYSTEM] Ready to process distributed requests...</div>
            </div>
        </main>
    </div>

    <script src="/js/logger.js"></script>
</body>
</html>
