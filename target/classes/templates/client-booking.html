<!DOCTYPE html>
<html>
<head>
    <title>Booking Client</title>
    <style>
        body { background: #020617; color: #fff; font-family: sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: auto; border: 1px solid #00ffff; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #00ffff; }
        select, input { width: 100%; padding: 10px; margin: 10px 0; background: #000; color: #00ffff; border: 1px solid #00ffff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #00ffff; color: #000; border: none; font-weight: bold; cursor: pointer; }
        #status { margin-top: 15px; padding: 10px; border-radius: 5px; display: none; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center; color: #00ffff;">ĐẶT VÉ MÁY BAY</h2>
        
        <label>Chọn Server xử lý:</label>
        <select id="serverUrl">
            <option value="https://booking-server-b2fh.onrender.com">Server của Dương (Node 1)</option>
            <option value="https://flight-booking-app-jwd4.onrender.com">Server bạn A (Node 2)</option>
            <option value="https://flight-booking-distributed.onrender.com">Server bạn B (Node 3)</option>
        </select>

        <label>Mã chuyến bay:</label>
        <input type="text" id="flightId" placeholder="VD: VN123">
        
        <label>Tên khách hàng:</label>
        <input type="text" id="userId" placeholder="Nhập tên của bạn">
        
        <button onclick="sendBooking()">XÁC NHẬN ĐẶT VÉ</button>
        
        <div id="status"></div>
    </div>

    <script>
        async function sendBooking() {
            const baseUrl = document.getElementById('serverUrl').value;
            const flightId = document.getElementById('flightId').value;
            const userId = document.getElementById('userId').value;
            const statusDiv = document.getElementById('status');

            if(!flightId || !userId) {
                alert("Vui lòng nhập đầy đủ thông tin!");
                return;
            }

            statusDiv.style.display = 'block';
            statusDiv.style.background = '#333';
            statusDiv.innerText = "Đang gửi yêu cầu...";

            try {
                // Gọi API đến Server đã chọn
                const response = await fetch(`${baseUrl}/api/booking?flightId=${flightId}&userId=${userId}`, {
                    method: 'POST'
                });
                const result = await response.text();
                
                statusDiv.style.background = '#065f46';
                statusDiv.innerText = "THÀNH CÔNG: " + result;
            } catch (err) {
                statusDiv.style.background = '#991b1b';
                statusDiv.innerText = "THẤT BẠI: Server này có thể đang tắt!";
            }
        }
    </script>
</body>
</html>
