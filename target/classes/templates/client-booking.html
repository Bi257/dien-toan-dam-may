<!DOCTYPE html>
<html>
<head>
    <title>Flight Client - Distributed System</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; color: #fff; font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { width: 400px; padding: 30px; border: 2px solid #00ffff; border-radius: 20px; box-shadow: 0 0 30px rgba(0,255,255,0.2); background: rgba(255,255,255,0.02); }
        h2 { text-align: center; color: #00ffff; text-shadow: 0 0 10px #00ffff; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-size: 0.8em; color: #888; }
        select, input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
        select:focus, input:focus { border-color: #00ffff; outline: none; }
        button { width: 100%; padding: 15px; background: #00ffff; border: none; border-radius: 5px; color: #000; font-weight: bold; font-family: 'Orbitron'; cursor: pointer; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 20px #fff; }
        #res { margin-top: 20px; padding: 10px; border-radius: 5px; font-size: 0.9em; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>RESERVATION</h2>
    <div class="input-group">
        <label>TARGET SERVER</label>
        <select id="url">
            <option value="">-- Select Server --</option>
            <option value="http://localhost:8080">Local Server (Test)</option>
            <option value="https://flight-server-duong.render.com">Cloud Node 1 (My Node)</option>
            <option value="https://peer-server-2.render.com">Cloud Node 2</option>
        </select>
    </div>
    <div class="input-group">
        <label>FLIGHT ID</label>
        <input type="text" id="flight" placeholder="e.g. VJ123">
    </div>
    <div class="input-group">
        <label>PASSENGER NAME</label>
        <input type="text" id="user" placeholder="Enter your name">
    </div>
    <button onclick="book()">CONFIRM BOOKING</button>
    <div id="res"></div>
</div>

<script>
    async function book() {
        const url = document.getElementById('url').value;
        const flight = document.getElementById('flight').value;
        const user = document.getElementById('user').value;
        const resBox = document.getElementById('res');

        if(!url || !flight || !user) { alert("Please fill all fields!"); return; }

        resBox.style.display = 'block';
        resBox.style.background = '#333';
        resBox.innerText = "Processing...";

        try {
            const api = `${url}/api/booking?flightId=${flight}&userId=${user}`;
            const response = await fetch(api, { method: 'POST' });
            const msg = await response.text();
            resBox.style.background = '#065f46';
            resBox.innerText = "SUCCESS: " + msg;
        } catch (err) {
            resBox.style.background = '#991b1b';
            resBox.innerText = "FAILED: Connection Refused!";
        }
    }
</script>
</body>
</html>
